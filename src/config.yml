# which directories should be walked to find OpenSpec projects?
scandirs:

  # a list of one/more starting points
  # this will have env vars expanded
  include:
    - $HOME/apps
    - $HOME/c*

  # a list of specific directories to exclude from the scan this will have env
  # vars expanded
  #
  # when path does not start with '/' the baseName of the directory will be
  # compared.
  exclude:
    - $GOPATH/pkg
    - .terraform

# if true, walking the directory tree underneath the `include` directories
# will traverse directories pointed to be symlinks
followsymlinks: true

# where `e` writes the zip it exports
#
# `~` and environment variables are expanded. The prompt opens on this; edit it
# there to redirect a single export without changing this file.
#
# default: your home directory
#export_dir: ~/Downloads

# which columns should the change list show, in order?
#
# valid fields: archived, date, name, specs, tasks
# default: name,tasks,specs,date
#
# active and archived changes are always both listed, grouped, with the active
# group first. The `archived` field is redundant against the group header and is
# not a default, but remains available here.
#
# overridden by --change-fields on the command line
#change_fields: name,tasks,specs,archived

