name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Extract the release notes from the changelog
        run: |
          # Written outside the checkout on purpose. GoReleaser validates git
          # state before it releases and counts an untracked file as dirty, so
          # a build artifact left in the tree stops the release with "git is in
          # a dirty state". That is what broke v0.7.3.
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          bash scripts/changelog-entry.sh "$version" CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi
          cat "$notes"

      - name: Run GoReleaser (Linux)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean -f .goreleaser-linux.yaml --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-darwin:
    runs-on: macos-latest
    needs: release-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Extract the release notes from the changelog
        run: |
          # Written outside the checkout on purpose. GoReleaser validates git
          # state before it releases and counts an untracked file as dirty, so
          # a build artifact left in the tree stops the release with "git is in
          # a dirty state". That is what broke v0.7.3.
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          bash scripts/changelog-entry.sh "$version" CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi
          cat "$notes"

      - name: Run GoReleaser (Darwin)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean -f .goreleaser-darwin.yaml --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
