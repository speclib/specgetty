version: 2

project_name: spg

before:
  hooks:
    - go mod tidy

builds:
  - main: ./src
    binary: spg
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums_darwin.txt"

# The release notes are the changelog entry for the version being released,
# passed in with --release-notes by the workflow. A commit-derived list beside
# it would be a second account of the same release, written in another register,
# and the two would disagree the first time a commit subject and a changelog
# entry described one change differently.
#
# `--release-notes` alone is what suppresses that list: it replaces the body
# goreleaser would otherwise generate. Disabling the changelog section was
# tried first and is the wrong switch: it turns the changelog pipe off, and
# that pipe is what reads `--release-notes`, so v0.7.3 published with no notes
# at all until they were set by hand. The log says which is happening: with the
# pipe off there is no `generating changelog` line.
